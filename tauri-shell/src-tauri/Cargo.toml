[package]
name = "pagedjs-preview-shell"
version = "0.1.0"
description = "Desktop shell for the Paged.js Flask preview"
authors = ["Paged.js Prototype"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
rfd = "0.15"
tauri = { version = "2", features = [] }
