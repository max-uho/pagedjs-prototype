<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paged.js + Alpine + Tailwind Markdown Preview</title>
  <link rel="icon" href="data:," />

  <script src="{{ url_for('static', filename='vendor/tailwindcss.js') }}"></script>

  <script>
    window.PagedConfig = { auto: false };
  </script>

  <script src="{{ url_for('static', filename='vendor/paged.polyfill.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/paged-preview.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/alpine.cdn.min.js') }}"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>

<body x-data="app()" x-init="init()" class="min-h-screen text-slate-900">
  <div class="sticky top-0 z-50 border-b border-slate-300 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3">
      <div>
        <h1 class="text-sm font-semibold tracking-tight" x-text="doc.sourceName || 'Paged.js Markdown Preview'"></h1>
        <p class="text-xs text-slate-500">
          <span x-text="doc.sections.length"></span> sections ·
          <span x-text="pageCount"></span> parsed pages
        </p>
      </div>
    </div>
  </div>

  <article id="source"></article>
  <section id="preview"></section>
</body>
</html>
